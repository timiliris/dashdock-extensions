<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit converter</title><link rel="stylesheet" href="style.css"></head><body><form id="converter"><label id="category-label" for="category"></label><select id="category"></select><div class="conversion"><div><label id="from-label" for="from"></label><select id="from"></select></div><button id="swap" type="button" aria-label="Inverser">⇄</button><div><label id="to-label" for="to"></label><select id="to"></select></div></div><label id="value-label" for="value"></label><input id="value" inputmode="decimal" maxlength="100" autocomplete="off"><output id="result" aria-live="polite"></output><p id="hint" class="muted"></p></form><p id="error" role="alert"></p><button id="retry" type="button" hidden></button><script src="bridge.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
