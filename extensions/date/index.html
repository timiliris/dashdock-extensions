<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Calendrier">Calendrier</title><link rel="stylesheet" href="style.css"><style>.heading{justify-content:space-between}.heading button{padding:4px 8px}.heading strong{font-size:13px;text-transform:capitalize}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:7px}.day,.weekday{padding:3px 0;font-size:12px;border-radius:6px}.weekday{color:var(--muted);font-size:10px}.outside{color:var(--muted);opacity:.55}.today{background:var(--accent);color:var(--accent-text,#18202b);font-weight:700}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:10px;color:var(--muted)}.foot button{padding:3px 6px;font-size:11px}</style></head><body><div class="row heading"><button id="prev" aria-label="Mois précédent" data-i18n-attrs='{"aria-label": "Mois précédent"}'>‹</button><strong id="month" aria-live="polite"></strong><button id="next" aria-label="Mois suivant" data-i18n-attrs='{"aria-label": "Mois suivant"}'>›</button></div><div class="grid" id="calendar" aria-label="Calendrier du mois" data-i18n-attrs='{"aria-label": "Calendrier du mois"}'></div><div class="foot"><span data-i18n="Date locale de votre navigateur">Date locale de votre navigateur</span><button id="today" data-i18n="Aujourd’hui">Aujourd’hui</button></div><script src="i18n.js"></script><script src="theme.js"></script><script src="app.js"></script></body></html>
