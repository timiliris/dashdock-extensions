<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chronomètre</title><link rel="stylesheet" href="style.css"></head><body>
<p id="status" role="status">Prêt à démarrer</p><div id="elapsed" role="timer" aria-live="off">00:00.00</div>
<div class="actions"><button id="toggle" type="button">Démarrer</button><button id="reset" type="button" disabled>Remettre à zéro</button></div>
<p class="note" id="note">Le chronomètre se réinitialise au rechargement.</p>
<script src="app.js"></script><script src="theme.js"></script></body></html>
