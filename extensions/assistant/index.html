<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant IA</title><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.view=new URLSearchParams(location.search).get('view')||'preview';</script></head><body>
<div class="assistant-toolbar"><span id="selection" class="caption"></span><button id="reset" class="reset-chat" type="button" aria-label="Nouvelle conversation">↺</button></div>
<section class="assistant-settings"><label id="provider-label" for="provider">Fournisseur</label><select id="provider"><option>…</option></select><label id="model-label" for="model">Modèle</label><div class="model-controls"><select id="model" aria-label="Modèle"></select><button id="connect" type="button">Modèles</button></div><div id="custom-model-field" hidden><label id="custom-model-label" for="custom-model">Identifiant du modèle</label><input id="custom-model" maxlength="256" autocomplete="off"></div><p id="hint" class="caption"></p></section>
<div id="conversation" class="conversation" role="log" aria-live="polite"><div id="empty" class="empty"><span class="assistant-mark" aria-hidden="true">✦</span><h2 id="empty-title"></h2><p id="empty-description"></p></div></div><p id="status" class="status" role="status"></p><form id="form"><textarea id="prompt" rows="2" maxlength="16000" required></textarea><button id="send" class="primary" type="submit" aria-label="Envoyer">↑</button></form><script src="app.js"></script><script src="theme.js"></script></body></html>
