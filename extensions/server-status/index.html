<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server status</title><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.view=new URLSearchParams(location.search).get("view")||"preview";</script></head><body><div class="row toolbar"><strong id="name">—</strong><button id="refresh" type="button">↻</button></div><div class="status" id="status" role="status"><span class="dot"></span><span id="state">—</span></div><div class="big" id="latency">—</div><div class="metrics"><span id="code"></span><span id="checked"></span></div><p class="caption" id="endpoint"></p><p id="error" class="error" role="alert"></p><div class="settings"><label id="label" for="target"></label><div class="row"><select id="target"></select><button id="apply" type="button"></button></div><p class="caption" id="note"></p><form id="service-form"><h2 id="create-title"></h2><label id="service-name-label" for="service-name"></label><input id="service-name" maxlength="100" required autocomplete="off"><label id="service-url-label" for="service-url"></label><input id="service-url" type="url" maxlength="2048" required placeholder="http://192.168.1.10:8080" autocomplete="url"><button id="create-service" type="submit"></button></form></div><script src="bridge.js"></script><script src="app.js"></script></body></html>
