<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus</title><link rel="stylesheet" href="style.css"><style>.modes{justify-content:center}.clock{text-align:center;font-size:48px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:8px 0}.actions{justify-content:center}.status{text-align:center;min-height:16px;margin:8px 0}.caption{text-align:center}details{font-size:11px}summary{cursor:pointer;padding:4px 0}#duration-form{margin:6px 0;align-items:end}#duration-form label{flex:1;min-width:0}#duration-form input{width:100%;padding:4px 6px;margin-top:4px}#duration-form button{padding:6px;font-size:11px}.clock{margin:4px 0;font-size:42px}.status{margin:6px 0}.caption{margin:5px 0}</style></head><body><div class="row modes"><button class="pill" id="work" aria-pressed="true">Focus · 25 min</button><button class="pill" id="break" aria-pressed="false">Pause · 5 min</button></div><div class="clock" id="clock" role="timer" aria-label="Temps restant" data-i18n-attrs='{"aria-label": "Temps restant"}'>25:00</div><div class="row actions"><button class="primary" id="toggle" data-i18n="Démarrer">Démarrer</button><button id="reset" data-i18n="Réinitialiser">Réinitialiser</button></div><p class="status muted" id="status" role="status" data-i18n="Prêt pour une session.">Prêt pour une session.</p><details id="settings"><summary id="settings-label">Durées du minuteur</summary><form id="duration-form" class="row"><label><span id="focus-label">Focus (min)</span><input id="focus-min" type="number" min="1" max="180" step="1" value="25" required></label><label><span id="break-label">Pause (min)</span><input id="break-min" type="number" min="1" max="180" step="1" value="5" required></label><button id="save" type="submit">Enregistrer</button></form></details><p class="caption" id="storage" role="status"></p><script src="i18n.js"></script><script src="theme.js"></script><script src="store.js"></script><script src="app.js"></script></body></html>
