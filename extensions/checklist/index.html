<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist</title><link rel="stylesheet" href="style.css"><style>form input{flex:1}.tasks{list-style:none;margin:9px 0;padding:0;max-height:135px;overflow:auto}.task{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}.task label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}.task span{overflow-wrap:anywhere}.task input:checked+span{text-decoration:line-through;color:var(--muted)}.task button{padding:2px 7px}.summary{justify-content:space-between}.summary button{padding:3px 6px;font-size:11px}</style></head><body><form id="form" class="row"><input id="task" placeholder="Une tâche à accomplir…" aria-label="Nouvelle tâche" maxlength="100" required autocomplete="off" data-i18n-attrs='{"placeholder": "Une tâche à accomplir…", "aria-label": "Nouvelle tâche"}'><button class="primary" type="submit" aria-label="Ajouter la tâche" data-i18n-attrs='{"aria-label": "Ajouter la tâche"}'>+</button></form><ul class="tasks" id="tasks"></ul><div class="row summary"><span class="muted" id="count" role="status" data-i18n="Votre liste est vide.">Votre liste est vide.</span><button id="clear" disabled data-i18n="Effacer les terminées">Effacer les terminées</button></div><p class="caption" id="storage" role="status"></p><button id="retry" hidden type="button">Réessayer</button><script src="i18n.js"></script><script src="theme.js"></script><script src="store.js"></script><script src="app.js"></script></body></html>
