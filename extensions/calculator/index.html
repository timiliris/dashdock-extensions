<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Calculatrice">Calculatrice</title><link rel="stylesheet" href="style.css"><style>.display{width:100%;text-align:right;font-size:20px;padding:7px 10px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}.keys button{padding:5px}.error{font-size:11px;min-height:15px;margin:4px 0;color:var(--muted)}</style></head><body><input class="display" id="expression" aria-label="Expression à calculer" placeholder="0" autocomplete="off" maxlength="120" inputmode="decimal" data-i18n-attrs='{"aria-label": "Expression à calculer"}'><p class="error" id="status" role="status" data-i18n="Entrée pour calculer · Échap pour effacer">Entrée pour calculer · Échap pour effacer</p><div class="keys" id="keys"><button data-action="clear">AC</button><button data-key="(">(</button><button data-key=")">)</button><button data-action="back" aria-label="Effacer le dernier caractère" data-i18n-attrs='{"aria-label": "Effacer le dernier caractère"}'>⌫</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="/" aria-label="Diviser" data-i18n-attrs='{"aria-label": "Diviser"}'>÷</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="*" aria-label="Multiplier" data-i18n-attrs='{"aria-label": "Multiplier"}'>×</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="-" aria-label="Soustraire" data-i18n-attrs='{"aria-label": "Soustraire"}'>−</button><button data-key="0">0</button><button data-key=".">.</button><button class="primary" data-action="calculate" aria-label="Calculer" data-i18n-attrs='{"aria-label": "Calculer"}'>=</button><button data-key="+" aria-label="Additionner" data-i18n-attrs='{"aria-label": "Additionner"}'>+</button></div><script src="i18n.js"></script><script src="theme.js"></script><script src="app.js"></script></body></html>
