name: Validate extensions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-catalogue.mjs --check
      - run: node tests/assistant.cjs
      - run: node tests/stopwatch.cjs
      - run: node tests/server-status.cjs
      - run: node tests/practical.cjs
      - run: node tests/scratchpad.cjs
      - run: node tests/extensions.cjs
      - run: node tests/scaffold.mjs
